<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="edgeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#shieldGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Tactical Grid Marks -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="256" r="100" fill="url(#lensGlow)"/>

  <!-- Center Camera Iris & Sensor -->
  <circle cx="256" cy="256" r="85" fill="#020617" stroke="url(#edgeCyan)" stroke-width="6"/>
  <circle cx="256" cy="256" r="48" fill="#0f172a" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="256" cy="256" r="24" fill="#06b6d4"/>
  <circle cx="244" cy="244" r="8" fill="#ffffff" opacity="0.8"/>

  <!-- Reticle Brackets (AI Bounding Box) -->
  <path d="M 120 170 L 120 120 L 170 120" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M 392 170 L 392 120 L 342 120" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M 120 342 L 120 392 L 170 392" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M 392 342 L 392 392 L 342 392" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>

  <!-- Crosshairs -->
  <line x1="256" y1="90" x2="256" y2="120" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="392" x2="256" y2="422" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="256" x2="120" y2="256" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="392" y1="256" x2="422" y2="256" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>

  <!-- AI Pulse Beacon -->
  <circle cx="360" cy="140" r="10" fill="#ef4444"/>
  <circle cx="360" cy="140" r="16" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
</svg>
